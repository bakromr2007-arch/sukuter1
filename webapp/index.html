<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0e1118" />
<title>Skuter kabinet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#0e1118; --bg-2:#131822; --surface:#181e29; --surface-2:#1f2735;
    --line:#2a3342; --line-soft:#222a37; --text:#eef1f6;
    --muted:#7e8a9c; --muted-2:#5a6577;
    --amber:#ffb020; --amber-soft:#2a2210;
    --ok:#34d399; --ok-soft:#0f2a20;
    --debt:#ff6b6b; --debt-soft:#2a1414;
    --blue:#60a5fa; --blue-soft:#152236;
    --radius-xl:26px; --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -20%,rgba(255,176,32,.06),transparent 60%),var(--bg)}
  h1,h2,h3,p{margin:0}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeUp .35s cubic-bezier(.2,.7,.3,1) both}

  /* Rol banneri */
  #role-banner {
    position:fixed;top:0;left:0;right:0;z-index:9999;
    background:rgba(0,0,0,.85);color:#4ade80;font:11px ui-monospace,monospace;
    padding:6px 10px;text-align:center;border-bottom:1px solid #4ade80;
    display:none;
  }
  #role-banner.show{display:block}
  #role-banner.admin{color:#ffb020;border-color:#ffb020}
  #role-banner.err{color:#ff6b6b;border-color:#ff6b6b}
  #role-banner .close{float:right;background:none;border:none;color:inherit;font-size:14px;padding:0 8px}

  #diag {
    max-width:600px;margin:40px auto;padding:24px 20px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  }
  #diag h2{font-size:20px;margin-bottom:12px}
  #diag p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:10px}
  #diag code{background:var(--bg-2);padding:2px 6px;border-radius:4px;font-size:12px;color:var(--amber)}
  #diag .step{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.6}
  #diag .step b{color:var(--amber)}
  #diag .raw{background:#000;color:#0f0;font:11px ui-monospace,monospace;padding:12px;
    border-radius:var(--radius-sm);word-break:break-all;margin-top:12px;max-height:180px;overflow:auto}

  .top{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .top .greet{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .top .sub{font-size:14px;color:var(--muted);margin-top:4px}
  .icon-btn{background:var(--surface);border:1px solid var(--line-soft);color:var(--muted);
    width:38px;height:38px;border-radius:12px;font-size:16px;display:flex;
    align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,background .15s}
  .icon-btn:active{transform:scale(.92);background:var(--surface-2)}
  .icon-btn.spinning{animation:spin .7s linear}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hero{position:relative;background:linear-gradient(155deg,var(--surface-2),var(--surface) 70%);
    border:1px solid var(--line);border-radius:var(--radius-xl);padding:26px 22px;
    margin-bottom:22px;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;
    background:radial-gradient(400px 200px at 100% 0%,rgba(255,176,32,.10),transparent 60%);
    pointer-events:none}
  .hero .label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--muted-2);font-weight:600;margin-bottom:12px}
  .hero .num{font-size:42px;font-weight:800;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1.05}
  .hero .num.debt{color:var(--debt)}
  .hero .num.ok{color:var(--ok)}
  .hero .num.blue{color:var(--blue)}
  .hero .cap{font-size:14px;color:var(--muted);margin-top:8px}

  .section-title{font-size:13px;font-weight:700;color:var(--muted-2);
    text-transform:uppercase;letter-spacing:.1em;margin:26px 4px 12px;
    display:flex;justify-content:space-between;align-items:center}
  .section-title .count{background:var(--surface);border:1px solid var(--line);
    border-radius:100px;padding:3px 10px;font-size:11px;color:var(--muted)}

  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap input{width:100%;background:var(--surface);border:1px solid var(--line-soft);
    border-radius:var(--radius-md);color:var(--text);padding:13px 14px 13px 40px;
    font-size:15px;outline:none;transition:border-color .15s}
  .search-wrap input:focus{border-color:var(--amber)}
  .search-wrap .sicon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--muted-2);font-size:15px;pointer-events:none}

  .filter-row{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
  .filter-chip{flex-shrink:0;background:var(--surface);border:1px solid var(--line-soft);
    color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:100px;
    transition:all .15s;white-space:nowrap}
  .filter-chip.active{background:var(--amber);color:#1a1300;border-color:var(--amber)}

  .rlist{display:flex;flex-direction:column;gap:10px}
  .rrow{background:var(--surface);border:1px solid var(--line-soft);
    border-radius:var(--radius-lg);padding:16px 18px;transition:border-color .2s,background .2s}
  .rrow:active{background:var(--surface-2)}
  .rrow.open{border-color:var(--line);background:var(--surface-2)}
  .rrow-top{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
  .rrow-name{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
  .rrow-scooter{font-size:13px;color:var(--muted);margin-top:3px}
  .rrow-status{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;
    white-space:nowrap;padding:5px 12px;border-radius:100px}
  .rrow-status.ok{color:var(--ok);background:var(--ok-soft)}
  .rrow-status.debt{color:var(--debt);background:var(--debt-soft)}
  .rrow-status.pending{color:var(--amber);background:var(--amber-soft)}
  .rrow-status.done{color:var(--muted);background:var(--surface-2)}

  .rrow-detail{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .rrow.open .rrow-detail{display:block;animation:fadeUp .25s both}

  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:var(--muted)}
  .kv b{color:var(--text);font-weight:600}

  .link-box{background:var(--bg-2);border:1px solid var(--line-soft);
    border-radius:var(--radius-sm);padding:11px 13px;font-size:12px;color:var(--muted);
    word-break:break-all;margin-top:12px;font-family:ui-monospace,monospace}
  .copy-btn{margin-top:8px;width:100%;padding:11px;border-radius:var(--radius-sm);
    border:1px solid var(--line);background:var(--surface-2);color:var(--text);
    font-size:14px;font-weight:600;transition:background .15s}
  .copy-btn:active{background:var(--line)}
  .danger-btn{color:var(--debt) !important}

  .pay-row{display:flex;gap:8px;margin-top:14px}
  .pay-row input{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--line);
    border-radius:var(--radius-sm);color:var(--text);padding:12px 14px;font-size:15px;
    font-variant-numeric:tabular-nums;outline:none}
  .pay-row input:focus{border-color:var(--amber)}
  .pay-row button{background:var(--amber);color:#1a1300;border:none;
    border-radius:var(--radius-sm);padding:0 20px;font-weight:700;font-size:14px;
    transition:transform .1s,opacity .15s}
  .pay-row button:active{transform:scale(.97)}
  .pay-row button:disabled{opacity:.5}

  .quick-amounts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .quick-btn{background:var(--surface-2);border:1px solid var(--line);
    color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px;
    border-radius:100px;transition:all .15s}
  .quick-btn:active{background:var(--amber);color:#1a1300;border-color:var(--amber)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted-2);margin-bottom:7px;
    text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--surface);
    border:1px solid var(--line-soft);border-radius:var(--radius-md);color:var(--text);
    padding:14px 16px;font-size:15px;outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber)}
  .field input[type="file"]{padding:12px;font-size:13px;color:var(--muted)}
  .field textarea{resize:vertical;min-height:70px}
  .field .hint{font-size:11.5px;color:var(--muted-2);margin-top:6px}

  .submit-btn{width:100%;padding:16px;border-radius:var(--radius-md);border:none;
    background:var(--amber);color:#1a1300;font-size:16px;font-weight:700;
    margin-top:8px;transition:transform .1s,opacity .15s}
  .submit-btn:active{transform:scale(.98)}
  .submit-btn:disabled{opacity:.5}

  .ghost-btn{width:100%;padding:14px;border-radius:var(--radius-md);
    border:1px solid var(--line);background:transparent;color:var(--muted);
    font-size:14px;font-weight:600;margin-top:10px}

  .payment-item{display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line-soft);
    border-radius:var(--radius-md);margin-bottom:8px}
  .payment-amount{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .payment-meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}

  .empty,.loading,.error,.notice{color:var(--muted);font-size:14px;
    padding:32px 20px;text-align:center}
  .error{color:var(--debt)}
  .notice{color:var(--ok);padding:12px 0;text-align:left}

  .tabbar{position:fixed;left:12px;right:12px;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;
    background:rgba(24,30,41,.92);backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--line);border-radius:20px;padding:6px;gap:6px;z-index:100;
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .tabbar button{flex:1;background:transparent;border:none;color:var(--muted);
    font-size:12.5px;font-weight:600;padding:12px 4px;border-radius:14px;transition:all .2s}
  .tabbar button.active{color:#1a1300;background:var(--amber)}

  .hidden{display:none !important}
  .skel{background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);
    background-size:200% 100%;animation:shimmer 1.4s infinite;
    border-radius:var(--radius-lg);height:76px;margin-bottom:10px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .stat-card{background:var(--surface);border:1px solid var(--line-soft);
    border-radius:var(--radius-md);padding:16px}
  .stat-card .k{font-size:11px;color:var(--muted-2);text-transform:uppercase;
    letter-spacing:.1em;font-weight:700;margin-bottom:8px}
  .stat-card .v{font-size:22px;font-weight:800;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  .stat-card .v.ok{color:var(--ok)}
  .stat-card .v.debt{color:var(--debt)}
  .stat-card .v.amber{color:var(--amber)}

  .progress-wrap{margin-top:12px}
  .progress-bar{height:6px;background:var(--bg-2);border-radius:100px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),#ff9500);
    border-radius:100px;transition:width .5s cubic-bezier(.2,.7,.3,1)}

  .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;padding:3px 8px;border-radius:100px;margin-right:6px}
  .badge.selfie{background:var(--blue-soft);color:var(--blue)}
  .badge.scooter{background:var(--amber-soft);color:var(--amber)}

  .role-badge{display:inline-block;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:100px;
    background:var(--amber-soft);color:var(--amber);margin-bottom:8px}
  .role-badge.user{background:var(--blue-soft);color:var(--blue)}

  .video-card{background:var(--surface);border:1px solid var(--line-soft);
    border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px}
  .video-header{padding:12px 14px;background:var(--surface-2);
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;font-weight:600;color:var(--text)}
  .video-header .icon{font-size:16px;margin-right:8px}
  .video-card video{width:100%;display:block;background:#000;max-height:420px}
  .video-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(20px);background:var(--surface-2);
    border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:100px;
    font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:all .25s;
    box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:rgba(255,107,107,.4);color:var(--debt)}
  .toast.ok{border-color:rgba(52,211,153,.4);color:var(--ok)}

  .login-box{max-width:340px;margin:60px auto 0}
  .login-box .field input{text-align:center;letter-spacing:.1em}
</style>
</head>
<body>
  <div id="role-banner"></div>

  <div id="app">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>

  <div id="tabbar" class="tabbar hidden">
    <button id="tab-dash" class="active" data-tab="dash">📊 Mijozlar</button>
    <button id="tab-new" data-tab="new">➕ Yangi</button>
    <button id="tab-history" data-tab="history">🗂 Tarix</button>
  </div>

<script>
  // ============================================================
  // TELEGRAM
  // ============================================================
  const tg = window.Telegram?.WebApp;
  try { tg?.ready(); tg?.expand(); } catch(e){}
  try { tg?.setHeaderColor?.("#0e1118"); } catch(e){}
  try { tg?.setBackgroundColor?.("#0e1118"); } catch(e){}

  function tryParse(str) {
    if (!str) return "";
    try {
      const p = new URLSearchParams(str);
      return p.get("tgWebAppData") || "";
    } catch (err) { return ""; }
  }

  function getInitData() {
    if (tg?.initData) return tg.initData;
    const fromHash = tryParse(window.location.hash.replace(/^#/, ""));
    const fromSearch = tryParse(window.location.search.replace(/^\?/, ""));
    return fromHash || fromSearch;
  }

  const initData = getInitData();
  const hasInitData = initData.length > 0;

  let adminToken = sessionStorage.getItem("admin_token") || "";
  const app = document.getElementById("app");
  const tabbar = document.getElementById("tabbar");
  const banner = document.getElementById("role-banner");
  const ORIGIN = window.location.origin;

  let currentFilter = "";
  let currentSearch = "";

  const fmt = n => Math.round(Number(n) || 0).toLocaleString("uz-UZ");
  const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
  const haptic = (t="success") => { try { tg?.HapticFeedback?.notificationOccurred?.(t); } catch(e){} };
  const hapticTap = () => { try { tg?.HapticFeedback?.impactOccurred?.("light"); } catch(e){} };
  const videoUrl = (u) => !u ? null : (u.startsWith("http") ? u : ORIGIN + u);

  function showBanner(text, kind = "") {
    banner.className = "show " + kind;
    banner.innerHTML = text + ' <button class="close" onclick="this.parentElement.className=\'\'">✕</button>';
  }

  function toast(msg, kind = "ok") {
    const t = document.createElement("div");
    t.className = `toast ${kind}`;
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 2600);
  }

  async function api(path, opts = {}) {
    const headers = opts.headers || {};
    if (adminToken) headers["X-Admin-Token"] = adminToken;
    const res = await fetch(path, { ...opts, headers });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Xatolik (${res.status})`);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  // ============================================================
  // BOOT — ROLNI ANIQLASH
  // ============================================================
  async function boot() {
    // 1) Telegram initData umuman yo'q bo'lsa — diagnostika ko'rsatamiz
    if (!hasInitData && !adminToken) {
      renderDiag();
      return;
    }

    try {
      const who = await api("/api/whoami?init_data=" + encodeURIComponent(initData));

      // 2) ADMIN — parol yoki Telegram orqali
      if (who.is_admin) {
        showBanner("🛡 <b>ADMIN</b> sifatida kirdingiz (" + (who.via === "password" ? "parol" : "Telegram") + ")", "admin");
        setTimeout(() => banner.className = "", 4000);
        tabbar.classList.remove("hidden");
        setActiveTab("dash");
        return;
      }

      // 3) Admin token eskirgan bo'lsa
      if (!hasInitData && adminToken) {
        sessionStorage.removeItem("admin_token");
        adminToken = "";
        renderDiag("Sessiya tugagan. Qayta kiring.");
        return;
      }

      // 4) Oddiy foydalanuvchi — kabinet
      showBanner("👤 <b>MIJOZ</b> sifatida kirdingiz" + (who.name ? " (" + esc(who.name) + ")" : ""));
      setTimeout(() => banner.className = "", 4000);
      await renderRenter(who.name || "");
    } catch (e) {
      showBanner("❌ Xatolik: " + esc(e.message), "err");
      app.innerHTML = `<p class="error" style="margin-top:60px">${esc(e.message)}</p>`;
    }
  }

  // ============================================================
  // DIAGNOSTIKA — initData yo'q bo'lganda
  // ============================================================
  function renderDiag(notice = "") {
    const urlPreview = window.location.href.slice(0, 200);
    app.innerHTML = `
      <div id="diag" class="fade">
        <h2>⚠️ Rol aniqlanmadi</h2>
        <p>Telegram WebApp sizga <code>initData</code> yubormadi, shuning uchun tizim sizni <b>admin</b> yoki <b>mijoz</b> sifatida taniy olmayapti.</p>
        ${notice ? `<p class="notice" style="color:var(--amber)">${esc(notice)}</p>` : ""}

        <div class="step">
          <b>1-qadam.</b> @BotFather → <code>/mybots</code> → botingiz → <b>Bot Settings</b> → <b>Domain</b> bo'limiga kiriting:
          <br><code>${location.hostname}</code>
        </div>
        <div class="step">
          <b>2-qadam.</b> Xuddi shu joyda <b>Menu Button</b> → <b>Edit menu button URL</b>:
          <br><code>${location.origin}</code>
        </div>
        <div class="step">
          <b>3-qadam.</b> Botni butunlay yopib, Telegram'dan chiqib, qaytadan <code>/start</code> bosing.
        </div>

        <p style="margin-top:20px;font-size:12px;color:var(--muted-2)">
          <b>Hozirgi URL:</b><br>
          <span style="font-size:10px;word-break:break-all">${esc(urlPreview)}${window.location.href.length > 200 ? "..." : ""}</span>
        </p>

        <div class="field" style="margin-top:20px">
          <label>Yoki admin parolingizni kiriting</label>
          <form id="diag-login">
            <input name="password" type="password" placeholder="Parol" required style="text-align:center;margin-bottom:10px">
            <button type="submit" class="submit-btn" id="diag-login-btn">Admin sifatida kirish</button>
          </form>
          <div id="diag-login-error"></div>
        </div>
      </div>`;

    document.getElementById("diag-login").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById("diag-login-btn");
      btn.disabled = true; btn.textContent = "Tekshirilmoqda...";
      const fd = new FormData(ev.target);
      try {
        const res = await api("/api/admin/login", { method: "POST", body: fd });
        adminToken = res.token;
        sessionStorage.setItem("admin_token", adminToken);
        haptic("success");
        showBanner("🛡 <b>ADMIN</b> sifatida kirdingiz", "admin");
        setTimeout(() => banner.className = "", 4000);
        tabbar.classList.remove("hidden");
        setActiveTab("dash");
      } catch (e) {
        haptic("error");
        document.getElementById("diag-login-error").innerHTML =
          `<p class="error">${esc(e.message)}</p>`;
        btn.disabled = false; btn.textContent = "Admin sifatida kirish";
      }
    });
  }

  function logout() {
    sessionStorage.removeItem("admin_token");
    adminToken = "";
    api("/api/admin/logout", { method: "POST" }).catch(() => {});
    tabbar.classList.add("hidden");
    renderDiag("Chiqdingiz.");
  }

  // ============================================================
  // ADMIN TABS
  // ============================================================
  function setActiveTab(tab) {
    hapticTap();
    document.getElementById("tab-dash").classList.toggle("active", tab === "dash");
    document.getElementById("tab-new").classList.toggle("active", tab === "new");
    document.getElementById("tab-history").classList.toggle("active", tab === "history");
    if (tab === "dash") renderDashboard();
    else if (tab === "history") renderDashboard({ status: "tugagan" });
    else renderNewClientForm();
  }
  tabbar.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-tab]");
    if (btn) setActiveTab(btn.dataset.tab);
  });

  // ============================================================
  // ADMIN: DASHBOARD
  // ============================================================
  async function renderDashboard(opts = {}) {
    const isHistory = opts.status === "tugagan";
    currentFilter = isHistory ? "tugagan" : (opts.status ?? currentFilter);
    app.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
    try {
      const params = new URLSearchParams({ init_data: initData });
      if (currentFilter) params.set("status", currentFilter);
      if (currentSearch) params.set("search", currentSearch);
      const rentals = await api("/api/admin/rentals?" + params.toString());

      let statsHtml = "";
      if (!isHistory) {
        const active = rentals.filter(r => r.status === "faol");
        const pending = rentals.filter(r => r.status === "kutilmoqda");
        const debtors = active.filter(r => r.debt > 0);
        const totalDebt = debtors.reduce((s, r) => s + r.debt, 0);
        const totalRevenue = active.reduce((s, r) => s + r.total_paid, 0);
        statsHtml = `
          <div class="top fade">
            <div>
              <span class="role-badge">🛡 ADMIN</span>
              <div class="greet">Nazorat paneli</div>
              <div class="sub">${active.length} faol · ${pending.length} kutilmoqda</div>
            </div>
            <button class="icon-btn" id="refresh-btn">⟳</button>
          </div>
          <div class="stat-grid fade">
            <div class="stat-card"><div class="k">Umumiy qarz</div>
              <div class="v ${totalDebt > 0 ? 'debt' : 'ok'}">${fmt(totalDebt)}</div></div>
            <div class="stat-card"><div class="k">Jami tushum</div>
              <div class="v amber">${fmt(totalRevenue)}</div></div>
            <div class="stat-card"><div class="k">Qarzdorlar</div>
              <div class="v ${debtors.length ? 'debt' : 'ok'}">${debtors.length}</div></div>
            <div class="stat-card"><div class="k">Faol ijaralar</div>
              <div class="v">${active.length}</div></div>
          </div>
          <div class="filter-row">
            ${["", "faol", "kutilmoqda"].map(s => `
              <button class="filter-chip ${currentFilter === s ? 'active' : ''}" data-filter="${s}">
                ${s === "" ? "Hammasi" : s === "faol" ? "Faol" : "Kutilmoqda"}
              </button>`).join("")}
          </div>`;
      } else {
        statsHtml = `
          <div class="top fade">
            <div>
              <span class="role-badge">🗂 TARIX</span>
              <div class="greet">Yakunlangan</div>
              <div class="sub">${rentals.length} ta</div>
            </div>
            <button class="icon-btn" id="refresh-btn">⟳</button>
          </div>`;
      }

      app.innerHTML = `
        ${statsHtml}
        <div class="search-wrap fade">
          <span class="sicon">🔍</span>
          <input id="search-input" placeholder="Qidirish..." value="${esc(currentSearch)}">
        </div>
        <div class="section-title fade"><span>Mijozlar</span><span class="count">${rentals.length}</span></div>
        <div class="rlist">
          ${rentals.length ? rentals.map(rentalRowHtml).join("") : `<p class="empty">Topilmadi.</p>`}
        </div>
      `;

      document.getElementById("refresh-btn")?.addEventListener("click", (ev) => {
        ev.currentTarget.classList.add("spinning");
        renderDashboard(isHistory ? { status: "tugagan" } : {});
      });

      document.querySelectorAll(".filter-chip").forEach(chip => {
        chip.addEventListener("click", () => renderDashboard({ status: chip.dataset.filter }));
      });

      let t;
      document.getElementById("search-input")?.addEventListener("input", (ev) => {
        clearTimeout(t);
        const val = ev.target.value;
        t = setTimeout(() => {
          currentSearch = val;
          renderDashboard(isHistory ? { status: "tugagan" } : { status: currentFilter });
        }, 350);
      });

      document.querySelectorAll(".rlist").forEach(l => l.addEventListener("click", onRowClick));
    } catch (e) {
      app.innerHTML = `<p class="error">${esc(e.message)}</p>`;
    }
  }

  function videoBlock(title, icon, url) {
    if (!url) return `<div class="video-card"><div class="video-header"><span><span class="icon">${icon}</span>${title}</span></div><div class="video-empty">Video yuklanmagan</div></div>`;
    return `<div class="video-card"><div class="video-header"><span><span class="icon">${icon}</span>${title}</span></div><video controls playsinline preload="metadata" src="${esc(videoUrl(url))}"></video></div>`;
  }

  function rentalRowHtml(r) {
    let statusHtml, statusClass;
    if (r.status === "kutilmoqda") { statusHtml = "⏳ Kutilmoqda"; statusClass = "pending"; }
    else if (r.status === "tugagan") { statusHtml = "✅ Tugagan"; statusClass = "done"; }
    else if (r.debt > 0) { statusHtml = "⚠️ " + fmt(r.debt); statusClass = "debt"; }
    else { statusHtml = "✅ Qarzsiz"; statusClass = "ok"; }

    let detail = "";
    if (r.status === "kutilmoqda") {
      detail = `<div class="rrow-detail">
        <p style="font-size:13.5px;color:var(--muted);line-height:1.5">Havolani mijozga yuboring:</p>
        <div class="link-box">${esc(r.reg_link)}</div>
        <button class="copy-btn" data-action="copy" data-link="${esc(r.reg_link)}">📋 Nusxalash</button>
        <button class="copy-btn danger-btn" data-action="delete" data-id="${r.id}">🗑 O'chirish</button>
      </div>`;
    } else if (r.status === "tugagan") {
      detail = `<div class="rrow-detail">
        <div class="kv"><span>Telefon</span><b>${esc(r.phone)}</b></div>
        <div class="kv"><span>Jami to'langan</span><b>${fmt(r.total_paid)} so'm</b></div>
        <div class="kv"><span>To'langan kunlar</span><b>${r.paid_days} kun</b></div>
      </div>`;
    } else {
      const badges = [];
      if (r.has_selfie) badges.push(`<span class="badge selfie">📹 Selfi</span>`);
      if (r.has_scooter_video) badges.push(`<span class="badge scooter">🛴 Skuter</span>`);
      detail = `<div class="rrow-detail">
        ${badges.length ? `<div style="margin-bottom:10px">${badges.join("")}</div>` : ""}
        <div class="kv"><span>Telefon</span><b>${esc(r.phone)}</b></div>
        <div class="kv"><span>Pasport</span><b>${esc(r.passport)}</b></div>
        <div class="kv"><span>Kunlik</span><b>${fmt(r.daily_rate)} so'm</b></div>
        <div class="kv"><span>To'langan kunlar</span><b>${r.paid_days} kun</b></div>
        <div class="kv"><span>Jami</span><b>${fmt(r.total_paid)} so'm</b></div>
        <div class="kv"><span>${r.debt > 0 ? "Qarz" : "To'langan"}</span>
          <b style="color:${r.debt > 0 ? 'var(--debt)' : 'var(--ok)'}">
            ${r.debt > 0 ? fmt(r.debt) + " so'm (" + r.debt_days + " kun)" : r.paid_until}</b></div>
        <div class="pay-row">
          <input type="number" inputmode="numeric" placeholder="Summa" id="pay-${r.id}">
          <button data-action="pay" data-id="${r.id}">Qabul</button>
        </div>
        <div class="quick-amounts">
          <button class="quick-btn" data-action="quick" data-id="${r.id}" data-amount="${r.daily_rate}">1 kun</button>
          <button class="quick-btn" data-action="quick" data-id="${r.id}" data-amount="${r.daily_rate*7}">1 hafta</button>
          <button class="quick-btn" data-action="quick" data-id="${r.id}" data-amount="${r.daily_rate*30}">1 oy</button>
        </div>
        <button class="copy-btn danger-btn" style="margin-top:12px" data-action="finish" data-id="${r.id}">🏁 Qaytarib olish</button>
        <div class="section-title" style="margin-top:20px"><span>Videolar</span></div>
        ${videoBlock("Selfi", "📹", r.video_selfie_url)}
        ${videoBlock("Skuter", "🛴", r.video_scooter_url)}
      </div>`;
    }

    return `<div class="rrow fade" id="row-${r.id}">
      <div class="rrow-top" data-action="toggle" data-id="${r.id}">
        <div><div class="rrow-name">${esc(r.full_name)}</div>
        <div class="rrow-scooter">${esc(r.scooter_info)}</div></div>
        <div class="rrow-status ${statusClass}">${statusHtml}</div>
      </div>${detail}</div>`;
  }

  async function onRowClick(ev) {
    const el = ev.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id ? Number(el.dataset.id) : null;

    if (action === "toggle") { hapticTap(); document.getElementById("row-"+id).classList.toggle("open"); return; }
    if (action === "copy") { ev.stopPropagation(); navigator.clipboard?.writeText(el.dataset.link); haptic("success"); toast("Nusxalandi"); return; }
    if (action === "quick") { ev.stopPropagation(); hapticTap(); document.getElementById("pay-"+id).value = Math.round(Number(el.dataset.amount)); return; }
    if (action === "pay") {
      ev.stopPropagation();
      const amount = parseFloat(document.getElementById("pay-"+id).value);
      if (!amount || amount <= 0) { haptic("error"); toast("Summa xato", "err"); return; }
      el.disabled = true;
      const fd = new FormData(); fd.append("init_data", initData); fd.append("rental_id", id); fd.append("amount", amount);
      try { await api("/api/admin/payments", { method: "POST", body: fd });
        haptic("success"); toast("To'lov qabul qilindi"); renderDashboard({ status: currentFilter });
      } catch (e) { haptic("error"); toast(e.message, "err"); el.disabled = false; }
      return;
    }
    if (action === "finish") {
      ev.stopPropagation();
      if (!confirm("Qaytarib olasizmi?")) return;
      const fd = new FormData(); fd.append("init_data", initData);
      try { await api("/api/admin/rentals/"+id+"/finish", { method: "POST", body: fd });
        haptic("success"); toast("Yakunlandi"); renderDashboard({ status: currentFilter });
      } catch (e) { haptic("error"); toast(e.message, "err"); }
      return;
    }
    if (action === "delete") {
      ev.stopPropagation();
      if (!confirm("O'chirasizmi?")) return;
      try { await api("/api/admin/rentals/"+id+"?init_data="+encodeURIComponent(initData), { method: "DELETE" });
        haptic("success"); toast("O'chirildi"); renderDashboard({ status: currentFilter });
      } catch (e) { haptic("error"); toast(e.message, "err"); }
      return;
    }
  }

  // ============================================================
  // ADMIN: YANGI MIJOZ
  // ============================================================
  function renderNewClientForm() {
    app.innerHTML = `
      <div class="top fade"><div>
        <span class="role-badge">🛡 ADMIN</span>
        <div class="greet">Yangi mijoz</div>
        <div class="sub">Ma'lumotlarni kiriting</div>
      </div></div>
      <form id="new-form" class="fade">
        <div class="field"><label>Ism familya *</label>
          <input name="full_name" required placeholder="Ali Valiyev"></div>
        <div class="field"><label>Telefon *</label>
          <input name="phone" required inputmode="tel" placeholder="+998 90 123 45 67"></div>
        <div class="field"><label>Pasport</label>
          <input name="passport" placeholder="AB1234567"></div>
        <div class="field"><label>Skuter *</label>
          <input name="scooter_info" required placeholder="Xiaomi · A123BC"></div>
        <div class="field"><label>Kunlik narx *</label>
          <input name="daily_rate" type="number" required min="1" placeholder="50000"></div>
        <div class="field"><label>To'lov turi</label>
          <select name="payment_type">
            <option value="kunlik">Kunlik</option>
            <option value="haftalik">Haftalik</option>
            <option value="oylik">Oylik</option>
          </select></div>
        <div class="field"><label>📹 Selfi video</label>
          <input name="video_selfie" type="file" accept="video/*" capture="user"></div>
        <div class="field"><label>🛴 Skuter video</label>
          <input name="video_scooter" type="file" accept="video/*" capture="environment"></div>
        <div class="field"><label>Izoh</label>
          <textarea name="notes"></textarea></div>
        <button type="submit" class="submit-btn" id="submit-btn">Qo'shish</button>
      </form>
      <div id="result"></div>`;
    document.getElementById("new-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true; btn.textContent = "Yuborilmoqda...";
      const fd = new FormData(ev.target);
      fd.append("init_data", initData);
      try {
        const rental = await api("/api/admin/rentals", { method: "POST", body: fd });
        haptic("success");
        document.getElementById("result").innerHTML = `
          <div class="hero fade" style="margin-top:20px">
            <div class="label">Muvaffaqiyatli</div>
            <div class="num ok" style="font-size:22px">${esc(rental.full_name)} qo'shildi</div>
            <div class="cap">Havolani mijozga yuboring:</div>
          </div>
          <div class="link-box">${esc(rental.reg_link)}</div>
          <button class="copy-btn" id="copy-new-link">📋 Nusxalash</button>`;
        document.getElementById("copy-new-link").addEventListener("click", () => {
          navigator.clipboard?.writeText(rental.reg_link);
          toast("Nusxalandi");
        });
        ev.target.reset();
      } catch (e) { haptic("error"); document.getElementById("result").innerHTML = `<p class="error">${esc(e.message)}</p>`; }
      finally { btn.disabled = false; btn.textContent = "Qo'shish"; }
    });
  }

  // ============================================================
  // USER: KABINET
  // ============================================================
  async function renderRenter(fallbackName = "") {
    app.innerHTML = `<div class="skel"></div><div class="skel"></div>`;
    let d;
    try {
      d = await api("/api/me?init_data=" + encodeURIComponent(initData));
    } catch (e) {
      app.innerHTML = `
        <div class="top fade" style="display:block">
          <span class="role-badge user">👤 MIJOZ</span>
          <div class="greet">${esc(fallbackName || "Salom")}</div>
          <div class="sub">Siz mijoz sifatida ro'yxatdan o'tmagansiz</div>
        </div>
        <div class="hero fade">
          <div class="label">Ma'lumot yo'q</div>
          <div class="num blue" style="font-size:22px">Skuter olinmagan</div>
          <div class="cap">Admin bilan bog'laning.</div>
        </div>`;
      return;
    }

    const hasDebt = d.debt > 0;
    let heroLabel, heroNum, heroClass, heroCap;
    if (hasDebt) {
      heroLabel = "⚠️ To'lash kerak";
      heroNum = fmt(d.debt) + " so'm";
      heroClass = "debt";
      heroCap = `${d.debt_days} kundan beri to'lov qilinmagan`;
    } else {
      heroLabel = "✅ Holat yaxshi";
      heroNum = "Qarzingiz yo'q";
      heroClass = "ok";
      heroCap = d.days_left > 0
        ? `Keyingi to'lov: ${d.paid_until} · yana ${d.days_left} kun`
        : `To'lov ${d.paid_until} sanasigacha yopilgan`;
    }

    const paymentsHtml = d.payments.length
      ? d.payments.map(p => `<div class="payment-item fade">
          <div class="payment-amount">${fmt(p.amount)} so'm</div>
          <div class="payment-meta">${p.date}<br>${p.days_covered} kunga</div>
        </div>`).join("")
      : `<p class="empty">Hali to'lov qilinmagan</p>`;

    const videoHtml = (d.has_selfie || d.has_scooter_video) ? `
      <div class="section-title fade"><span>Videolar</span></div>
      ${videoBlock("Selfi", "📹", d.video_selfie_url)}
      ${videoBlock("Skuter", "🛴", d.video_scooter_url)}` : "";

    app.innerHTML = `
      <div class="top fade" style="display:block">
        <span class="role-badge user">👤 MIJOZ</span>
        <div class="greet">${esc(d.full_name)}</div>
        <div class="sub">${esc(d.scooter_info)} · ${fmt(d.daily_rate)} so'm/kun</div>
      </div>
      <div class="hero fade">
        <div class="label">${heroLabel}</div>
        <div class="num ${heroClass}">${heroNum}</div>
        <div class="cap">${heroCap}</div>
      </div>
      <div class="section-title fade"><span>Skuter</span></div>
      <div class="rrow fade" style="padding:16px 18px">
        <div class="kv"><span>🛴 Skuter</span><b>${esc(d.scooter_info)}</b></div>
        <div class="kv"><span>💰 Kunlik</span><b>${fmt(d.daily_rate)} so'm</b></div>
        <div class="kv"><span>🚀 Boshlangan</span><b>${d.start_date}</b></div>
        <div class="kv"><span>📆 To'langan</span><b>${d.paid_until}</b></div>
      </div>
      <div class="stat-grid fade">
        <div class="stat-card"><div class="k">Jami to'langan</div><div class="v amber">${fmt(d.total_paid)}</div></div>
        <div class="stat-card"><div class="k">To'langan kunlar</div><div class="v">${d.paid_days} kun</div></div>
        ${hasDebt ? `
          <div class="stat-card"><div class="k">Qarz kunlari</div><div class="v debt">${d.debt_days} kun</div></div>
          <div class="stat-card"><div class="k">To'lash kerak</div><div class="v debt" style="font-size:18px">${fmt(d.debt)}</div></div>
        ` : `
          <div class="stat-card"><div class="k">Qolgan kunlar</div><div class="v ok">${d.days_left} kun</div></div>
          <div class="stat-card"><div class="k">Keyingi to'lov</div><div class="v ok" style="font-size:16px">${d.paid_until}</div></div>
        `}
      </div>
      ${videoHtml}
      <div class="section-title fade"><span>To'lovlar tarixi</span><span class="count">${d.payments.length}</span></div>
      <div>${paymentsHtml}</div>`;
  }

  boot();
</script>
