services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      BOT_USERNAME: ${BOT_USERNAME}
      WEBAPP_URL: ${WEBAPP_URL}
      DATABASE_URL: sqlite:////app/data/scooter.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
